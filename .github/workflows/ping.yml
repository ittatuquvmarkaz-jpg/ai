name: ping
on:
  push:
    branches: [media]
    paths: ['jobs/ping.txt']
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media }
      - run: |
          ffmpeg -version | head -1 > jobs/ping_result.txt
          curl -s -o /dev/null -w "%{http_code}" https://api.elevenlabs.io/ >> jobs/ping_result.txt
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add jobs/ping_result.txt && git commit -m "ping result [skip ci]" && git push
