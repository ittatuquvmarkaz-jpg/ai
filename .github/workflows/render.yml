name: render-reel
on:
  push:
    branches: [media]
    paths: ['jobs/*.json']
permissions:
  contents: write
concurrency: { group: render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: media, fetch-depth: 2 }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
      - name: Render changed jobs
        run: |
          set -e
          for job in $(git diff --name-only HEAD~1 HEAD -- 'jobs/*.json'); do
            [ -f "$job" ] || continue
            echo "Rendering $job"
            python3 render/render.py "$job" reels/ 2>&1 | tee -a jobs/render_log.txt
          done
          rm -rf reels/_tmp
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reels jobs/render_log.txt
          git commit -m "Rendered reel [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin media && git push
